<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="A tablet held at an angle showing a 3D modelling viewport, with a stylus, illustrating Blender coming to tablets">
  <defs>
    <radialGradient id="bg" cx="42%" cy="40%" r="82%">
      <stop offset="0%" stop-color="#221c15"/><stop offset="60%" stop-color="#17130e"/><stop offset="100%" stop-color="#0e0b08"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#20262e"/><stop offset="100%" stop-color="#141a21"/>
    </linearGradient>
    <linearGradient id="obj" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5b53a"/><stop offset="100%" stop-color="#e8812e"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- label -->
  <g font-family="'Space Grotesk', system-ui, sans-serif" fill="#f3efe8">
    <text x="84" y="120" font-size="20" letter-spacing="6" fill="#f0781a" opacity="0.9">BLENDER · ON THE MOVE</text>
    <text x="82" y="182" font-size="56" font-weight="700">Blender on a Tablet</text>
    <text x="84" y="224" font-size="23" fill="#a69d90">The full 3D suite, in your hands.</text>
  </g>

  <!-- tablet -->
  <g filter="url(#sh)" transform="translate(690,150) rotate(8)">
    <rect x="0" y="0" width="420" height="300" rx="24" fill="#2b2622" stroke="#3f382f" stroke-width="2"/>
    <rect x="14" y="14" width="392" height="272" rx="14" fill="url(#screen)"/>
    <!-- viewport grid -->
    <g stroke="#2f3a44" stroke-width="1.5" opacity="0.7">
      <path d="M14 150 L406 150"/><path d="M14 190 L406 210"/><path d="M14 230 L406 262"/>
      <path d="M120 286 L170 100"/><path d="M230 286 L250 100"/><path d="M340 286 L330 100"/>
    </g>
    <!-- a generic low-poly 3D object on the canvas (original, abstract) -->
    <g transform="translate(210,150)">
      <polygon points="0,-72 66,-30 54,46 -54,46 -66,-30" fill="url(#obj)"/>
      <polygon points="0,-72 66,-30 0,-8" fill="#ffcf6b"/>
      <polygon points="0,-72 -66,-30 0,-8" fill="#f0a23a"/>
      <polygon points="66,-30 54,46 0,-8" fill="#e8812e"/>
      <polygon points="-66,-30 -54,46 0,-8" fill="#d9731f"/>
      <polygon points="54,46 -54,46 0,-8" fill="#c9641a"/>
      <g stroke="#241002" stroke-width="1.6" fill="none" opacity="0.5"><polygon points="0,-72 66,-30 54,46 -54,46 -66,-30"/><path d="M0,-8 L0,-72 M0,-8 L66,-30 M0,-8 L54,46 M0,-8 L-54,46 M0,-8 L-66,-30"/></g>
    </g>
    <!-- toolbar dots -->
    <g fill="#4a5560"><circle cx="34" cy="40" r="5"/><circle cx="34" cy="60" r="5"/><circle cx="34" cy="80" r="5"/><circle cx="34" cy="100" r="5"/></g>
  </g>

  <!-- stylus -->
  <g filter="url(#sh)" transform="translate(560,430) rotate(-38)">
    <rect x="0" y="0" width="300" height="20" rx="10" fill="#cdd3da"/>
    <rect x="0" y="0" width="60" height="20" rx="10" fill="#f0781a"/>
    <polygon points="300,2 320,10 300,18" fill="#8a929b"/>
  </g>
  <!-- pencil touch point glow -->
  <circle cx="885" cy="300" r="10" fill="#fff" opacity="0.65"/>
  <circle cx="885" cy="300" r="22" fill="none" stroke="#f5b53a" stroke-width="3" opacity="0.5"/>
</svg>
