<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="A Blender 5.3 release banner with a point-cloud splat, a DLSS badge and feature chips">
  <defs>
    <radialGradient id="bg" cx="38%" cy="36%" r="86%">
      <stop offset="0%" stop-color="#1d1a24"/><stop offset="60%" stop-color="#141119"/><stop offset="100%" stop-color="#0d0b10"/>
    </radialGradient>
    <linearGradient id="big" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5b53a"/><stop offset="100%" stop-color="#f0781a"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2740"/><stop offset="100%" stop-color="#1c1a2c"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.55"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- gaussian-splat point cloud, top right -->
  <g opacity="0.95">
    <g fill="#2e7de0"><circle cx="860" cy="120" r="5"/><circle cx="905" cy="135" r="7"/><circle cx="950" cy="110" r="4"/><circle cx="995" cy="150" r="6"/></g>
    <g fill="#f0781a"><circle cx="880" cy="160" r="6"/><circle cx="935" cy="175" r="5"/><circle cx="980" cy="190" r="7"/><circle cx="1030" cy="165" r="5"/></g>
    <g fill="#17a26a"><circle cx="910" cy="205" r="6"/><circle cx="965" cy="225" r="4"/><circle cx="1015" cy="210" r="6"/><circle cx="1055" cy="200" r="5"/></g>
    <g fill="#d94f8f"><circle cx="945" cy="100" r="4"/><circle cx="1000" cy="118" r="5"/><circle cx="1050" cy="130" r="4"/></g>
    <g fill="#8a56d6"><circle cx="890" cy="235" r="5"/><circle cx="1000" cy="248" r="6"/><circle cx="1060" cy="238" r="4"/></g>
  </g>
  <text x="852" y="285" font-family="system-ui,sans-serif" font-size="14" fill="#6f7686">3D Gaussian splats</text>

  <!-- title -->
  <g font-family="'Space Grotesk', system-ui, sans-serif">
    <text x="84" y="150" font-size="20" letter-spacing="6" fill="#f0781a" opacity="0.9">RELEASED · NOV 2026</text>
    <text x="80" y="300" font-size="150" font-weight="700" fill="url(#big)">5.3</text>
    <text x="84" y="356" font-size="40" font-weight="700" fill="#f3efe8">What's new in Blender</text>
  </g>

  <!-- feature chips -->
  <g font-family="'Space Grotesk', system-ui, sans-serif" font-size="21" fill="#dfe0ef">
    <g filter="url(#sh)">
      <rect x="84" y="430" width="250" height="60" rx="14" fill="url(#chip)" stroke="#3a3658"/>
      <text x="110" y="468">DLSS viewport</text>
      <rect x="352" y="430" width="230" height="60" rx="14" fill="url(#chip)" stroke="#3a3658"/>
      <text x="378" y="468">Vulkan default</text>
      <rect x="600" y="430" width="300" height="60" rx="14" fill="url(#chip)" stroke="#3a3658"/>
      <text x="626" y="468">EEVEE toon shading</text>
      <rect x="84" y="508" width="270" height="60" rx="14" fill="url(#chip)" stroke="#3a3658"/>
      <text x="110" y="546">Grease Pencil tools</text>
      <rect x="372" y="508" width="250" height="60" rx="14" fill="url(#chip)" stroke="#3a3658"/>
      <text x="398" y="546">VSE ripple edit</text>
      <rect x="640" y="508" width="260" height="60" rx="14" fill="url(#chip)" stroke="#3a3658"/>
      <text x="666" y="546">Projects system</text>
    </g>
  </g>
</svg>
