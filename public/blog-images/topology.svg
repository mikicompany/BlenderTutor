<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Two 3D mesh patches side by side: a clean grid of quads labelled good, and a messy mix of triangles, an n-gon and a pole labelled bad">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="82%">
      <stop offset="0%" stop-color="#201a14"/><stop offset="60%" stop-color="#17130e"/><stop offset="100%" stop-color="#0e0b08"/>
    </radialGradient>
    <linearGradient id="good" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a3a30"/><stop offset="100%" stop-color="#1b2822"/>
    </linearGradient>
    <linearGradient id="bad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a2824"/><stop offset="100%" stop-color="#281a17"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity="0.5"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- label -->
  <g font-family="'Space Grotesk', system-ui, sans-serif" fill="#f3efe8">
    <text x="84" y="104" font-size="20" letter-spacing="6" fill="#f0781a" opacity="0.9">BLENDER · MODELLING</text>
    <text x="82" y="162" font-size="52" font-weight="700">Topology: Good vs Bad</text>
  </g>

  <!-- GOOD patch -->
  <g filter="url(#sh)" transform="translate(120,230)">
    <rect x="-12" y="-12" width="384" height="324" rx="14" fill="url(#good)" stroke="#2f5a44" stroke-width="2"/>
    <!-- clean quad grid -->
    <g stroke="#4fd38a" stroke-width="2" opacity="0.9">
      <path d="M0 0 H360 M0 50 H360 M0 100 H360 M0 150 H360 M0 200 H360 M0 250 H360 M0 300 H360"/>
      <path d="M0 0 V300 M60 0 V300 M120 0 V300 M180 0 V300 M240 0 V300 M300 0 V300 M360 0 V300"/>
    </g>
    <!-- highlighted edge loop -->
    <path d="M0 150 H360" stroke="#f0781a" stroke-width="4"/>
  </g>
  <g transform="translate(120,230)">
    <circle cx="300" cy="-34" r="20" fill="#1f7a4d"/>
    <path d="M291 -34 l6 7 l12 -15" stroke="#eafff3" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="128" y="588" font-family="system-ui,sans-serif" font-size="18" fill="#9fd9bc">All quads · even spacing · clean loops</text>

  <!-- BAD patch -->
  <g filter="url(#sh)" transform="translate(700,230)">
    <rect x="-12" y="-12" width="384" height="324" rx="14" fill="url(#bad)" stroke="#6a3a30" stroke-width="2"/>
    <g stroke="#f06a4f" stroke-width="2" opacity="0.92" fill="none">
      <!-- outer frame -->
      <path d="M0 0 H360 V300 H0 Z"/>
      <!-- a pole: vertex with many edges meeting -->
      <path d="M150 120 L60 0 M150 120 L150 0 M150 120 L250 0 M150 120 L0 90 M150 120 L0 180 M150 120 L70 300 M150 120 L250 240"/>
      <!-- scattered triangles / bad cuts -->
      <path d="M250 0 L360 90 L250 240 M360 90 L250 60 M360 180 L250 240 L360 300 M250 240 L150 300 M70 300 L150 120 L250 240"/>
      <path d="M0 180 L70 300 M0 90 L60 0"/>
    </g>
    <!-- n-gon (highlighted many-sided face) -->
    <polygon points="250,60 360,90 360,180 250,240 150,120" fill="#f0781a" opacity="0.18" stroke="#f5b53a" stroke-width="3"/>
    <text x="260" y="150" font-family="system-ui,sans-serif" font-size="15" fill="#f5b53a">n-gon</text>
    <!-- pole marker -->
    <circle cx="150" cy="120" r="7" fill="#f5b53a"/>
    <text x="96" y="118" font-family="system-ui,sans-serif" font-size="14" fill="#f5b53a">pole</text>
  </g>
  <g transform="translate(700,230)">
    <circle cx="300" cy="-34" r="20" fill="#8a2f26"/>
    <path d="M292 -42 l16 16 M308 -42 l-16 16" stroke="#ffeae6" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
  <text x="708" y="588" font-family="system-ui,sans-serif" font-size="18" fill="#e3a79b">Tris, n-gons &amp; poles where they hurt</text>
</svg>
