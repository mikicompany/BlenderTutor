<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="Left: a single value is one number travelling down the wire, while a field gives one value per element and is re-asked at every node, so the same field wired into two places can answer differently. Right: socket shapes since 2025 — a bar for a single value, a diamond for a field, a circle for a dynamic type that takes more than one kind of data; the diamond-with-a-dot shape older tutorials describe no longer exists. Middle: domain decides meaning, as a Position node read on the point domain gives every vertex position while on the face domain it gives the centre of every face. Bottom: drop a Viewer node and read the real numbers in the Spreadsheet rather than guessing.">
  <rect width="1200" height="700" fill="#0f1011"/>
  <defs><style>
    .hd  { font-family:system-ui,sans-serif; font-size:15px; font-weight:700; letter-spacing:2px; }
    .ti  { font-family:system-ui,sans-serif; font-size:17px; font-weight:700; }
    .it  { font-family:system-ui,sans-serif; font-size:15px; font-weight:600; }
    .bd  { font-family:system-ui,sans-serif; font-size:13.5px; }
    .sm  { font-family:system-ui,sans-serif; font-size:12px; font-weight:700; letter-spacing:1.4px; }
    .nm  { font-family:system-ui,sans-serif; font-size:12px; font-weight:700; }
    .cap { font-family:system-ui,sans-serif; font-size:13px; }
  </style></defs>
  <text class="hd" x="60" y="48" fill="#f37d16">A VALUE IS A NUMBER. A FIELD IS A QUESTION.</text>
  <rect x="60" y="84" width="530" height="268" rx="13" fill="#161718" stroke="#2c3033" stroke-width="2"/>
  <text class="sm" x="88" y="122" fill="#f0b429">THE IDEA EVERYTHING ELSE RESTS ON</text>
  <rect x="92" y="156" width="14" height="34" rx="4" fill="#5b9bd5"/>
  <text class="ti" x="122" y="172" fill="#e8e6e3">0.5</text>
  <text class="bd" x="176" y="172" fill="#8fb4d8">one value, the same everywhere</text>
  <text class="cap" x="122" y="194" fill="#6f767c">A single number travelling down the wire.</text>
  <path d="M99 240 L113 254 L99 268 L85 254 z" fill="#f37d16"/>
  <text class="ti" x="122" y="240" fill="#f0b429">a field</text>
  <text class="bd" x="196" y="240" fill="#d6b06a">one value per element</text>
  <circle cx="132" cy="288" r="7" fill="#f37d16"/>
  <text class="nm" x="132" y="278" fill="#f0b429" text-anchor="middle">0.2</text>
  <circle cx="194" cy="288" r="7" fill="#f37d16"/>
  <text class="nm" x="194" y="278" fill="#f0b429" text-anchor="middle">0.9</text>
  <circle cx="256" cy="288" r="7" fill="#f37d16"/>
  <text class="nm" x="256" y="278" fill="#f0b429" text-anchor="middle">0.4</text>
  <circle cx="318" cy="288" r="7" fill="#f37d16"/>
  <text class="nm" x="318" y="278" fill="#f0b429" text-anchor="middle">0.7</text>
  <circle cx="380" cy="288" r="7" fill="#f37d16"/>
  <text class="nm" x="380" y="278" fill="#f0b429" text-anchor="middle">0.1</text>
  <circle cx="442" cy="288" r="7" fill="#f37d16"/>
  <text class="nm" x="442" y="278" fill="#f0b429" text-anchor="middle">0.8</text>
  <circle cx="504" cy="288" r="7" fill="#f37d16"/>
  <text class="nm" x="504" y="278" fill="#f0b429" text-anchor="middle">0.5</text>
  <text class="cap" x="122" y="316" fill="#6f767c">Not stored. Re-asked at every node — which is why the same field</text>
  <text class="cap" x="122" y="334" fill="#6f767c">wired into two places can answer differently.</text>
  <rect x="620" y="84" width="520" height="268" rx="13" fill="#161718" stroke="#2c3033" stroke-width="2"/>
  <text class="sm" x="648" y="122" fill="#f0b429">SOCKET SHAPES, SINCE 2025</text>
  <rect x="655" y="146" width="13" height="30" rx="4" fill="#5b9bd5"/>
  <text class="it" x="700" y="158" fill="#e8e6e3">Single value</text>
  <text class="bd" x="700" y="180" fill="#868c92">One number, one colour, one string.</text>
  <path d="M661 204 L677 220 L661 236 L645 220 z" fill="#f37d16"/>
  <text class="it" x="700" y="218" fill="#e8e6e3">Field</text>
  <text class="bd" x="700" y="240" fill="#868c92">A value that varies per element.</text>
  <circle cx="661" cy="280" r="14" fill="#5ddb8b"/>
  <text class="it" x="700" y="278" fill="#e8e6e3">Dynamic</text>
  <text class="bd" x="700" y="300" fill="#868c92">Takes more than one kind of data.</text>
  <text class="cap" x="648" y="332" fill="#ff7b72">Older tutorials describe a diamond with a dot in it. That shape is gone.</text>
  <rect x="60" y="376" width="1080" height="136" rx="13" fill="#1b1e20" stroke="#3b4247" stroke-width="2"/>
  <text class="sm" x="88" y="412" fill="#f0b429">DOMAIN DECIDES WHAT THE QUESTION MEANS</text>
  <rect x="88" y="432" width="150" height="46" rx="8" fill="#24282b" stroke="#f37d16" stroke-width="2"/>
  <text class="it" x="163" y="461" fill="#f0b429" text-anchor="middle">Position</text>
  <line x1="242" y1="440" x2="296" y2="440" stroke="#5a6167" stroke-width="2"/>
  <line x1="242" y1="472" x2="296" y2="472" stroke="#5a6167" stroke-width="2"/>
  <path d="M292 434 L304 440 L292 446 z" fill="#5a6167"/>
  <path d="M292 466 L304 472 L292 478 z" fill="#5a6167"/>
  <text class="it" x="316" y="446" fill="#8fb4d8">read on the Point domain</text>
  <text class="bd" x="316" y="468" fill="#868c92">→ the position of every vertex</text>
  <text class="it" x="700" y="446" fill="#8fc9a6">read on the Face domain</text>
  <text class="bd" x="700" y="468" fill="#868c92">→ the centre of every face</text>
  <text class="bd" x="88" y="498" fill="#d6dade">Same node, same wire, different answer. When a tree gives nonsense, the domain is the first thing to check.</text>
  <rect x="60" y="534" width="1080" height="98" rx="13" fill="#10211a" stroke="#2f7d4f" stroke-width="2"/>
  <text class="sm" x="88" y="570" fill="#5ddb8b">YOU ARE NOT MEANT TO GUESS</text>
  <text class="bd" x="88" y="602" fill="#cfe9d8">Drop a Viewer node anywhere in the tree and the Spreadsheet shows the real numbers at that point. It is the debugger, and skipping it is why</text>
  <text class="bd" x="88" y="624" fill="#cfe9d8">geometry nodes feels like magic rather than engineering.</text>
  <text x="600" y="672" fill="#55595e" class="cap" text-anchor="middle">Most tutorials teach you a recipe. These three ideas let you write your own &#8212; blendertutoring.com</text>
</svg>
