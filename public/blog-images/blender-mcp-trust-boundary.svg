<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="A chain from the AI client, through the MCP server process, over a socket on localhost port 9876, into the Blender add-on, and finally into exec with no sandbox or validation. A dashed red boundary marks where the model's text becomes code running on your machine: the Python runs inside Blender's own process with your account permissions, and modules like os, subprocess, socket and shutil are importable. Three common pitfalls: the add-on usually needs starting from the sidebar each session, only one client per Blender instance, and port 9876 conflicts. Finally, the package blender-mcp has been renamed mcp-for-blender, with old commands still working through a compatibility wrapper.">
  <rect width="1200" height="700" fill="#0f1011"/>
  <defs><style>
    .hd  { font-family:system-ui,sans-serif; font-size:15px; font-weight:700; letter-spacing:2px; }
    .ti  { font-family:system-ui,sans-serif; font-size:17px; font-weight:700; }
    .it  { font-family:system-ui,sans-serif; font-size:15px; font-weight:600; }
    .bd  { font-family:system-ui,sans-serif; font-size:13px; }
    .sm  { font-family:system-ui,sans-serif; font-size:12px; font-weight:700; letter-spacing:1.4px; }
    .mn  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:13px; font-weight:600; }
    .cap { font-family:system-ui,sans-serif; font-size:13px; }
  </style></defs>
  <text class="hd" x="60" y="48" fill="#f37d16">WHERE THE MODEL'S TEXT BECOMES CODE THAT RUNS</text>
  <rect x="60" y="96" width="236" height="104" rx="12" fill="#161718" stroke="#2c3033" stroke-width="2"/>
  <text class="ti" x="82" y="134" fill="#5b9bd5">AI client</text>
  <text class="bd" x="82" y="160" fill="#aeb4ba">Claude Code, Cursor,</text>
  <text class="bd" x="82" y="180" fill="#aeb4ba">VS Code, Gemini CLI</text>
  <rect x="336" y="96" width="236" height="104" rx="12" fill="#161718" stroke="#2c3033" stroke-width="2"/>
  <text class="ti" x="358" y="134" fill="#5b9bd5">MCP server</text>
  <text class="bd" x="358" y="160" fill="#aeb4ba">uvx mcp-for-blender</text>
  <text class="bd" x="358" y="180" fill="#aeb4ba">a separate process</text>
  <rect x="612" y="96" width="236" height="104" rx="12" fill="#161718" stroke="#2c3033" stroke-width="2"/>
  <text class="ti" x="634" y="134" fill="#5b9bd5">Blender add-on</text>
  <text class="bd" x="634" y="160" fill="#aeb4ba">socket server running</text>
  <text class="bd" x="634" y="180" fill="#aeb4ba">inside Blender</text>
  <line x1="300" y1="148" x2="321" y2="148" stroke="#5a6167" stroke-width="2.5"/>
  <path d="M318 141 L332 148 L318 155 z" fill="#5a6167"/>
  <line x1="576" y1="148" x2="597" y2="148" stroke="#5a6167" stroke-width="2.5"/>
  <path d="M594 141 L608 148 L594 155 z" fill="#5a6167"/>
  <text class="mn" x="438" y="86" fill="#6f767c" text-anchor="middle">localhost:9876</text>
  <line x1="878" y1="74" x2="878" y2="300" stroke="#8a3034" stroke-width="2.5" stroke-dasharray="8 6"/>
  <line x1="852" y1="148" x2="893" y2="148" stroke="#ff7b72" stroke-width="2.5"/>
  <path d="M890 141 L904 148 L890 155 z" fill="#ff7b72"/>
  <rect x="904" y="96" width="236" height="104" rx="12" fill="#231314" stroke="#8a3034" stroke-width="2"/>
  <text class="mn" x="926" y="134" fill="#ff7b72">exec()</text>
  <text class="bd" x="926" y="160" fill="#e8c4c2">no sandbox,</text>
  <text class="bd" x="926" y="180" fill="#e8c4c2">no validation</text>
  <text class="cap" x="700" y="326" fill="#ff7b72" text-anchor="middle">Left of this line it is text. Right of it, code running on your machine.</text>
  <rect x="60" y="360" width="540" height="180" rx="12" fill="#231314" stroke="#8a3034" stroke-width="2"/>
  <text class="sm" x="88" y="396" fill="#ff7b72">WHAT THAT ACTUALLY MEANS</text>
  <text class="it" x="88" y="430" fill="#ff7b72">•</text>
  <text class="bd" x="108" y="430" fill="#e8c4c2">The Python runs inside Blender's own process.</text>
  <text class="it" x="88" y="456" fill="#ff7b72">•</text>
  <text class="bd" x="108" y="456" fill="#e8c4c2">So it runs as you, with your account's permissions.</text>
  <text class="it" x="88" y="482" fill="#ff7b72">•</text>
  <text class="bd" x="108" y="482" fill="#e8c4c2">os, subprocess, socket and shutil are all importable.</text>
  <text class="it" x="88" y="508" fill="#ff7b72">•</text>
  <text class="bd" x="108" y="508" fill="#e8c4c2">Nothing between the model's output and exec().</text>
  <text class="cap" x="88" y="534" fill="#b08c8c">Scanners disagree on how bad this is. They agree it is there.</text>
  <rect x="640" y="360" width="500" height="180" rx="12" fill="#1b1e20" stroke="#3b4247" stroke-width="2"/>
  <text class="sm" x="668" y="396" fill="#f0b429">THE THREE THAT WASTE AN EVENING</text>
  <text class="it" x="668" y="432" fill="#f0b429">The add-on</text>
  <text class="bd" x="774" y="432" fill="#9aa0a6">usually needs starting from Blender's sidebar every session.</text>
  <text class="it" x="668" y="468" fill="#f0b429">One client</text>
  <text class="bd" x="774" y="468" fill="#9aa0a6">per Blender instance. A second one fights the first.</text>
  <text class="it" x="668" y="504" fill="#f0b429">Port 9876</text>
  <text class="bd" x="764" y="504" fill="#9aa0a6">is the default, so anything else using it breaks the link.</text>
  <text class="cap" x="668" y="534" fill="#7d848a">None of these is in the quickstart you followed.</text>
  <rect x="60" y="556" width="1080" height="90" rx="12" fill="#10211a" stroke="#2f7d4f" stroke-width="2"/>
  <text class="sm" x="88" y="586" fill="#5ddb8b">AND THE NAME CHANGED</text>
  <text class="bd" x="88" y="612" fill="#cfe9d8">blender-mcp is now mcp-for-blender — same project, renamed. Old commands still work through a</text>
  <text class="bd" x="88" y="634" fill="#cfe9d8">compatibility wrapper, which is exactly why half the guides you find still say the old name.</text>
  <text x="600" y="672" fill="#55595e" class="cap" text-anchor="middle">Worth knowing before you point a model at your own machine &#8212; blendertutoring.com</text>
</svg>
