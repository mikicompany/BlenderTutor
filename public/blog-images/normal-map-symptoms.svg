<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="A symptom map for normal-map bakes in Blender. Flat purple surface means it is not being read as a normal map; set the image to Non-Color and add a Normal Map node. Washed-out detail means the Normal Map strength is below one, or colour space is wrong; set strength to one. Skewed streaks or exploded artifacts mean the ray distance is wrong; tune extrusion or use a cage. Visible seams along UV edges mean too little bake margin or hard edges off the seams; set margin to 8 to 16 pixels. Inverted bumps, where raised reads as sunk, mean the green channel convention is wrong; flip green for a DirectX engine like Unreal. Faceted shading showing through means the low-poly is not shade smooth; shade it smooth to match the bake.">
  <rect width="1200" height="760" fill="#0f1011"/>
  <defs>
    <style>
      .hd { font-family:system-ui,sans-serif; font-size:15px; font-weight:700; letter-spacing:2px; fill:#f37d16; }
      .col{ font-family:system-ui,sans-serif; font-size:11px; font-weight:700; letter-spacing:1.5px; fill:#6f767c; }
      .see{ font-family:system-ui,sans-serif; font-size:14.5px; font-weight:700; fill:#e8e6e3; }
      .bd { font-family:system-ui,sans-serif; font-size:13.5px; fill:#aeb4ba; }
      .fx { font-family:system-ui,sans-serif; font-size:13px; font-weight:600; fill:#f0b429; }
      .ft { font-family:system-ui,sans-serif; font-size:13px; fill:#6f767c; }
      .row{ fill:#161718; stroke:#2c3033; stroke-width:2; }
    </style>
  </defs>

  <text class="hd" x="60" y="50">WHAT THE BAKE LOOKS LIKE — AND WHAT IS ACTUALLY WRONG</text>

  <text class="col" x="104" y="94">WHAT YOU SEE</text>
  <text class="col" x="540" y="94">THE CAUSE</text>
  <text class="col" x="900" y="94">FIRST FIX</text>

  <!-- 1 purple -->
  <g>
    <rect class="row" x="60" y="110" width="1080" height="92" rx="12"/>
    <rect x="76" y="140" width="16" height="16" rx="4" fill="#8f8ff0"/>
    <text class="see" x="104" y="148">Flat lavender purple</text>
    <text class="bd"  x="104" y="174">No detail at all, like raw plastic</text>
    <text class="bd"  x="540" y="148">Not being read as a normal map</text>
    <text class="bd"  x="540" y="174">sRGB colour space, or no Normal Map node</text>
    <text class="fx"  x="900" y="148">Set image to Non-Color</text>
    <text class="fx"  x="900" y="174">Image → Normal Map → BSDF</text>
  </g>

  <!-- 2 washed -->
  <g>
    <rect class="row" x="60" y="214" width="1080" height="84" rx="12"/>
    <rect x="76" y="246" width="16" height="16" rx="4" fill="#b9bfe8"/>
    <text class="see" x="104" y="252">Detail there but washed out</text>
    <text class="bd"  x="104" y="276">Faint, like someone turned it down</text>
    <text class="bd"  x="540" y="252">Normal Map strength below 1</text>
    <text class="fx"  x="900" y="252">Set strength back to 1.0</text>
  </g>

  <!-- 3 streaks -->
  <g>
    <rect class="row" x="60" y="310" width="1080" height="84" rx="12"/>
    <rect x="76" y="342" width="16" height="16" rx="4" fill="#e879f9"/>
    <text class="see" x="104" y="348">Skewed streaks, melted edges</text>
    <text class="bd"  x="104" y="372">Detail smearing off one side</text>
    <text class="bd"  x="540" y="348">Ray distance too long or short</text>
    <text class="fx"  x="900" y="348">Tune extrusion, or use a cage</text>
  </g>

  <!-- 4 seams -->
  <g>
    <rect class="row" x="60" y="406" width="1080" height="84" rx="12"/>
    <rect x="76" y="438" width="16" height="16" rx="4" fill="#6ee7b7"/>
    <text class="see" x="104" y="444">Hard seams on the UV edges</text>
    <text class="bd"  x="104" y="468">Lines exactly where islands split</text>
    <text class="bd"  x="540" y="444">Too little margin; hard edges off seams</text>
    <text class="fx"  x="900" y="444">Margin 8–16 px; seams = hard edges</text>
  </g>

  <!-- 5 inverted -->
  <g>
    <rect class="row" x="60" y="502" width="1080" height="84" rx="12"/>
    <rect x="76" y="534" width="16" height="16" rx="4" fill="#f0b429"/>
    <text class="see" x="104" y="540">Bumps read as dents</text>
    <text class="bd"  x="104" y="564">Lighting looks inside out</text>
    <text class="bd"  x="540" y="540">Green channel convention wrong</text>
    <text class="fx"  x="900" y="540">Flip green for a DirectX engine</text>
  </g>

  <!-- 6 faceted -->
  <g>
    <rect class="row" x="60" y="598" width="1080" height="84" rx="12"/>
    <rect x="76" y="630" width="16" height="16" rx="4" fill="#9ca3af"/>
    <text class="see" x="104" y="636">Faceted shading shows through</text>
    <text class="bd"  x="104" y="660">Blocky, on curved surfaces</text>
    <text class="bd"  x="540" y="636">Low-poly not Shade Smooth</text>
    <text class="fx"  x="900" y="636">Shade smooth, bake and render</text>
  </g>

  <text class="ft" x="60" y="716">Four conventions have to agree — UVs, colour space, shading, engine handedness. The symptom tells you which one broke.</text>
</svg>
