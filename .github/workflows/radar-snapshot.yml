name: Radar PDF Snapshot

on:
  schedule:
    # 1st and 15th at 14:00 UTC — roughly a fortnight apart, on predictable dates
    - cron: '0 14 1,15 * *'
  workflow_dispatch:
    inputs:
      send_email:
        description: 'Email the snapshot to subscribers'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build the PDF snapshot
        env:
          VITE_RAWG_API_KEY: ${{ secrets.VITE_RAWG_API_KEY }}
        run: node scripts/radar-snapshot.js

      - name: Publish it to the site
        id: publish
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/snapshots
          if git diff --staged --quiet; then
            echo "nothing to commit"
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Radar snapshot $(date -u +%Y-%m-%d)"
            git push
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      # Only on the schedule, or when a manual run asks for it.
      - name: Email subscribers
        if: steps.publish.outputs.published == 'true' && (github.event_name == 'schedule' || inputs.send_email)
        env:
          MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
          MAILCHIMP_LIST_ID: ${{ secrets.MAILCHIMP_LIST_ID }}
          MAILCHIMP_REPLY_TO: ${{ secrets.MAILCHIMP_REPLY_TO }}
          MAILCHIMP_SEGMENT_ID: ${{ secrets.MAILCHIMP_SEGMENT_ID }}
        run: node scripts/radar-email.js
