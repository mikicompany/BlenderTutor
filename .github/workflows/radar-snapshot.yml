name: Radar PDF Snapshot

on:
  schedule:
    # 1st and 15th at 14:00 UTC — roughly a fortnight apart, on predictable dates
    - cron: '0 14 1,15 * *'
  workflow_dispatch:
    inputs:
      test_email:
        description: 'Send a test to this address only (no subscribers contacted)'
        type: string
        default: ''
      send_email:
        description: 'Send for real, to every subscriber'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

# Never let two snapshot runs deploy Pages over each other.
concurrency:
  group: radar-snapshot
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build the PDF snapshot
        env:
          VITE_RAWG_API_KEY: ${{ secrets.VITE_RAWG_API_KEY }}
        run: node scripts/radar-snapshot.js

      - name: Commit it
        id: publish
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/snapshots
          if git diff --staged --quiet; then
            echo "nothing to commit"
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Radar snapshot $(date -u +%Y-%m-%d)"
            git push
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      # This push is made with GITHUB_TOKEN, which by design does not trigger
      # deploy.yml, so this workflow has to publish Pages itself or the PDF
      # would never reach the web.
      - uses: actions/upload-pages-artifact@v3
        if: steps.publish.outputs.published == 'true'
        with:
          path: ./docs

  deploy:
    needs: build
    if: needs.build.outputs.published == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  email:
    needs: [build, deploy]
    # A test address mails only that address. A real send needs the schedule or
    # an explicit tick.
    if: >-
      github.event_name == 'schedule' || inputs.send_email || inputs.test_email != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Send
        env:
          MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
          MAILCHIMP_LIST_ID: ${{ secrets.MAILCHIMP_LIST_ID }}
          MAILCHIMP_REPLY_TO: ${{ secrets.MAILCHIMP_REPLY_TO }}
          MAILCHIMP_SEGMENT_ID: ${{ secrets.MAILCHIMP_SEGMENT_ID }}
          TEST_EMAIL: ${{ inputs.test_email }}
        run: node scripts/radar-email.js
