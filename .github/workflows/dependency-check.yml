name: Dependency Check

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1'  # every Monday at 8am UTC

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run npm audit
        run: npm audit --audit-level=critical
