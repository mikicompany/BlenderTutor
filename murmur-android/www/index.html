<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' blob: data:; script-src 'self' blob: 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; media-src 'self' blob:; connect-src 'self' blob: data:" />
  <title>Murmur</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <style>
    :root {
      --bg: #0f1115;
      --panel: #181b22;
      --panel-2: #20242d;
      --text: #eef0f4;
      --muted: #8b93a3;
      --line: #2a2f3a;
      --accent: #5b8cff;
      --work: #ff8a3d;
      --danger: #ff5d5d;
      --ok: #3ecf8e;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column;
      padding: var(--safe-area-inset-top, env(safe-area-inset-top, 0px)) 0 var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px; border-bottom: 1px solid var(--line);
    }
    h1 { font-size: 20px; margin: 0; letter-spacing: .2px; }
    .mode {
      display: flex; align-items: center; gap: 10px;
      font-size: 14px; color: var(--muted); user-select: none;
    }
    .mode strong { color: var(--text); font-weight: 600; white-space: nowrap; text-align: right; }
    body.work .mode strong { color: var(--work); }
    .switch { position: relative; width: 52px; height: 30px; flex: none; }
    .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
    .switch span {
      position: absolute; inset: 0; border-radius: 30px;
      background: var(--panel-2); border: 1px solid var(--line); transition: .2s;
    }
    .switch span::after {
      content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px;
      border-radius: 50%; background: #fff; transition: .2s;
    }
    .switch input:checked + span { background: var(--work); border-color: var(--work); }
    .switch input:checked + span::after { transform: translateX(22px); }
    .switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

    .banner {
      margin: 12px 16px 0; padding: 10px 12px; border-radius: 10px; font-size: 14px;
      background: rgba(255,138,61,.12); color: var(--work); border: 1px solid rgba(255,138,61,.35);
      display: none;
    }
    body.work .banner { display: block; }

    .tabs { display: flex; gap: 6px; padding: 12px 16px 0; }
    .tabs button {
      flex: 1; padding: 10px; border-radius: 10px; border: 1px solid var(--line);
      background: var(--panel); color: var(--muted); font: inherit; font-size: 15px; cursor: pointer;
    }
    .tabs button[aria-selected="true"] { background: var(--panel-2); color: var(--text); border-color: #3a4150; }
    .count { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 6px; border-radius: 10px;
      background: var(--line); font-size: 12px; line-height: 20px; color: var(--text); }

    main { flex: 1; overflow-y: auto; padding: 12px 16px 200px; }
    .empty { color: var(--muted); text-align: center; margin-top: 48px; font-size: 15px; }
    .list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .card {
      background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
    }
    .note .meta { font-size: 12px; color: var(--muted); margin-bottom: 4px; display: flex; justify-content: space-between; gap: 8px; }
    .note p { margin: 0; white-space: pre-wrap; word-wrap: break-word; }
    .task { display: flex; gap: 12px; align-items: flex-start; }
    .task input[type=checkbox] { width: 22px; height: 22px; margin-top: 1px; accent-color: var(--ok); flex: none; }
    .task .body { flex: 1; min-width: 0; }
    .task .text { outline: none; word-wrap: break-word; }
    .task.done .text { text-decoration: line-through; color: var(--muted); }
    .tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 8px; margin-top: 4px; margin-right: 4px;
      background: rgba(91,140,255,.15); color: var(--accent); }
    .tag.due { background: rgba(255,138,61,.15); color: var(--work); }
    .icon-btn {
      background: none; border: 0; color: var(--muted); font-size: 18px; padding: 2px 6px; cursor: pointer; flex: none;
    }
    .icon-btn:hover { color: var(--danger); }
    .linkish { background: none; border: 0; color: var(--accent); font: inherit; font-size: 12px; cursor: pointer; padding: 0; }
    .toolbar { display: flex; gap: 8px; justify-content: flex-end; margin-bottom: 10px; }
    .toolbar button {
      background: var(--panel); border: 1px solid var(--line); color: var(--text); border-radius: 8px;
      padding: 6px 10px; font: inherit; font-size: 13px; cursor: pointer;
    }

    .dock {
      position: fixed; left: 0; right: 0; bottom: 0;
      padding: 12px 16px calc(16px + var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px)));
      background: linear-gradient(to top, var(--bg) 70%, rgba(15,17,21,0));
      display: flex; flex-direction: column; align-items: center; gap: 10px;
    }
    .live {
      width: 100%; max-width: 640px; min-height: 0; max-height: 120px; overflow-y: auto;
      background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px;
      font-size: 15px; display: none;
    }
    .live.show { display: block; }
    .live .interim { color: var(--muted); }
    .mic {
      width: 76px; height: 76px; border-radius: 50%; border: 0; cursor: pointer;
      background: var(--accent); color: #fff; display: grid; place-items: center;
      box-shadow: 0 6px 24px rgba(91,140,255,.35); transition: transform .1s, background .2s;
    }
    body.work .mic { background: var(--work); box-shadow: 0 6px 24px rgba(255,138,61,.35); }
    .mic:active { transform: scale(.96); }
    .mic.rec { background: var(--danger) !important; box-shadow: 0 0 0 0 rgba(255,93,93,.6); animation: pulse 1.4s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,93,93,.55); } 70% { box-shadow: 0 0 0 18px rgba(255,93,93,0); } 100% { box-shadow: 0 0 0 0 rgba(255,93,93,0); } }
    .mic svg { width: 32px; height: 32px; }
    .hint { font-size: 13px; color: var(--muted); text-align: center; }
    .brand { display: flex; align-items: center; gap: 8px; }
    header .mode { margin-left: auto; }
    .tag.high { background: rgba(255,93,93,.15); color: var(--danger); }
    .pending { display: flex; gap: 12px; align-items: flex-start; border-style: dashed; }
    .pending .label { color: #b79bff; font-size: 14px; }
    .pending .src { color: var(--muted); font-size: 13px; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .spinner { width: 18px; height: 18px; margin-top: 2px; flex: none; border-radius: 50%;
      border: 2px solid rgba(183,155,255,.25); border-top-color: #b79bff; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .rec-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--danger);
      margin-right: 6px; animation: blink 1s infinite; }
    @keyframes blink { 50% { opacity: .25; } }
    .badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; white-space: nowrap;
      border: 1px solid rgba(62,207,142,.4); color: var(--ok); background: rgba(62,207,142,.08); }
    .langs { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    .langs button { font: inherit; font-size: 12px; padding: 5px 12px; border: 0; background: var(--panel);
      color: var(--muted); cursor: pointer; }
    .langs button + button { border-left: 1px solid var(--line); }
    .langs button[aria-pressed="true"] { background: var(--panel-2); color: var(--text); font-weight: 600; }
    .tag.lang { margin: 0 0 0 4px; padding: 0 5px; font-size: 10px; vertical-align: 1px; }
    .toast {
      position: fixed; left: 50%; top: calc(68px + var(--safe-area-inset-top, env(safe-area-inset-top, 0px))); transform: translateX(-50%);
      background: var(--panel-2); border: 1px solid var(--line); padding: 8px 14px; border-radius: 10px;
      font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 10;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>Murmur</h1>
      <span class="badge" title="Nothing leaves this phone">🔒 On-device</span>
    </div>
    <label class="mode">
      <strong id="modeLabel">Work mode off</strong>
      <span class="switch">
        <input type="checkbox" id="workToggle" aria-label="Work mode" />
        <span></span>
      </span>
    </label>
  </header>

  <div class="banner">Work mode is on — everything you say becomes an action item.</div>

  <div class="tabs" role="tablist">
    <button role="tab" id="tab-notes" aria-selected="true">Transcripts<span class="count" id="notesCount">0</span></button>
    <button role="tab" id="tab-tasks" aria-selected="false">Action items<span class="count" id="tasksCount">0</span></button>
  </div>

  <main id="main"></main>

  <div class="dock">
    <div class="live" id="live"></div>
    <button class="mic" id="mic" aria-label="Start recording">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/>
      </svg>
    </button>
    <div class="langs" id="langs" role="group" aria-label="Language">
      <button data-lang="auto">Auto</button><button data-lang="en">EN</button><button data-lang="es">ES</button>
    </div>
    <div class="hint" id="hint">Tap to start talking</div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
