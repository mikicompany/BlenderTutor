<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found — BlenderTutor</title>
  <!-- Genuinely missing pages should stay out of the index. Every real route
       is prerendered to its own file at build time, so this page is only
       reached by URLs that do not exist. -->
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #0f1011;
      color: #ffffff;
      font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      text-align: center;
    }
    .logo { display: flex; align-items: center; gap: 8px; margin-bottom: 48px; text-decoration: none; }
    .logo img { width: 26px; height: 26px; }
    .logo span { font-size: 20px; font-weight: 700; color: #ffffff; letter-spacing: -0.3px; }
    .logo span b { color: #F37D16; font-weight: 700; }
    .code { font-size: 96px; font-weight: 700; line-height: 1; color: #F37D16; letter-spacing: -4px; }
    h1 { font-size: 26px; font-weight: 600; margin: 18px 0 12px; }
    p { color: #9a9a9a; font-size: 15px; line-height: 1.6; max-width: 430px; margin: 0 auto 34px; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    a.btn {
      display: inline-block; padding: 11px 26px; border-radius: 999px;
      font-size: 14px; font-weight: 700; text-decoration: none; transition: opacity .2s;
    }
    a.btn:hover { opacity: .85; }
    .primary { background: #F37D16; color: #0f1011; }
    .ghost { border: 1px solid rgba(255,255,255,.18); color: #e6e6e6; }
    .links { margin-top: 40px; font-size: 13px; color: #6a6a6a; }
    .links a { color: #9a9a9a; text-decoration: none; margin: 0 9px; }
    .links a:hover { color: #F37D16; }
    @media (max-width: 480px) { .code { font-size: 72px; } h1 { font-size: 22px; } }
  </style>
</head>
<body>
  <a class="logo" href="/">
    <img src="/blender.svg" alt="">
    <span><b>B</b>lender Tutoring.com</span>
  </a>

  <div class="code">404</div>
  <h1>This one didn't render</h1>
  <p>
    The page you're after doesn't exist — it may have moved, or the link might
    have a typo. The tutorials and the blog are all still here.
  </p>

  <div class="actions">
    <a class="btn primary" href="/">Back to home</a>
    <a class="btn ghost" href="/blog">Read the blog</a>
  </div>

  <div class="links">
    <a href="/blog">Blog</a>·<a href="/radar">The Radar</a>·<a href="https://calendly.com/blendertutoring-info/">Book a call</a>
  </div>
</body>
</html>
