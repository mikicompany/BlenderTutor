<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Many parallel coloured data streams flowing into a GPU chip, illustrating Blender's modern Vulkan graphics backend">
  <defs>
    <radialGradient id="bg" cx="60%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#1a1b22"/><stop offset="60%" stop-color="#121218"/><stop offset="100%" stop-color="#0c0c10"/>
    </radialGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a3550"/><stop offset="100%" stop-color="#1b2234"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.55"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- parallel streams -->
  <g stroke-linecap="round" fill="none" stroke-width="7" opacity="0.95">
    <g>
      <path d="M70 180 H760" stroke="#f0781a" stroke-dasharray="40 18"/>
      <path d="M70 240 H760" stroke="#f5b53a" stroke-dasharray="34 20"/>
      <path d="M70 300 H760" stroke="#2e7de0" stroke-dasharray="46 16"/>
      <path d="M70 360 H760" stroke="#17a26a" stroke-dasharray="30 22"/>
      <path d="M70 420 H760" stroke="#d94f8f" stroke-dasharray="42 18"/>
      <path d="M70 480 H760" stroke="#8a56d6" stroke-dasharray="36 20"/>
    </g>
  </g>
  <!-- stream labels -->
  <text x="70" y="150" font-family="system-ui,sans-serif" font-size="15" fill="#6f7686">parallel command streams — low driver overhead</text>

  <!-- GPU chip -->
  <g filter="url(#sh)" transform="translate(770,205)">
    <rect x="0" y="0" width="230" height="230" rx="22" fill="url(#chip)" stroke="#3c4a68" stroke-width="2"/>
    <rect x="34" y="34" width="162" height="162" rx="12" fill="#10151f" stroke="#4a5c80"/>
    <g font-family="'Space Grotesk',system-ui,sans-serif" fill="#cdd8ef"><text x="115" y="128" font-size="38" font-weight="700" text-anchor="middle">GPU</text></g>
    <!-- pins -->
    <g fill="#f0781a"><rect x="-14" y="40" width="14" height="10" rx="2"/><rect x="-14" y="80" width="14" height="10" rx="2"/><rect x="-14" y="120" width="14" height="10" rx="2"/><rect x="-14" y="160" width="14" height="10" rx="2"/></g>
    <g fill="#5a677a"><rect x="60" y="-14" width="10" height="14" rx="2"/><rect x="110" y="-14" width="10" height="14" rx="2"/><rect x="160" y="-14" width="10" height="14" rx="2"/><rect x="60" y="230" width="10" height="14" rx="2"/><rect x="110" y="230" width="10" height="14" rx="2"/><rect x="160" y="230" width="10" height="14" rx="2"/></g>
  </g>

  <!-- label -->
  <g font-family="'Space Grotesk', system-ui, sans-serif" fill="#f3efe8">
    <text x="72" y="552" font-size="20" letter-spacing="6" fill="#f0781a" opacity="0.9">BLENDER 5.3 · UNDER THE HOOD</text>
    <text x="70" y="610" font-size="52" font-weight="700">Blender goes Vulkan</text>
  </g>
</svg>
