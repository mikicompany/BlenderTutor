<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-label="GPT-6 Astra connects to Blender through an MCP client, the Blender MCP server and a Blender addon">
  <rect width="760" height="300" fill="#0f1011"/>
  <text x="380" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff">What connects to what</text>
  <text x="380" y="60" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" fill="#9a9a9a">Astra reads and edits the Blender session you already have open</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#9a9a9a"/>
    </marker>
  </defs>

  <g font-family="system-ui, sans-serif">
    <rect x="24" y="96" width="150" height="86" rx="12" fill="#F37D16" fill-opacity="0.14" stroke="#F37D16" stroke-width="1.5"/>
    <text x="99" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#F37D16">GPT-6 Astra</text>
    <text x="99" y="152" text-anchor="middle" font-size="11.5" fill="#cfcfcf">the reasoning</text>

    <rect x="208" y="96" width="150" height="86" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.5"/>
    <text x="283" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">MCP client</text>
    <text x="283" y="152" text-anchor="middle" font-size="11.5" fill="#9a9a9a">spawns + relays</text>

    <rect x="392" y="96" width="150" height="86" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.5"/>
    <text x="467" y="124" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Blender MCP</text>
    <text x="467" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">server</text>
    <text x="467" y="162" text-anchor="middle" font-size="11.5" fill="#9a9a9a">uvx blender-mcp</text>

    <rect x="576" y="96" width="160" height="86" rx="12" fill="#F37D16" fill-opacity="0.14" stroke="#F37D16" stroke-width="1.5"/>
    <text x="656" y="124" text-anchor="middle" font-size="14" font-weight="700" fill="#F37D16">Blender addon</text>
    <text x="656" y="146" text-anchor="middle" font-size="11.5" fill="#cfcfcf">TCP socket into</text>
    <text x="656" y="163" text-anchor="middle" font-size="11.5" fill="#cfcfcf">your open session</text>
  </g>

  <line x1="178" y1="139" x2="204" y2="139" stroke="#9a9a9a" stroke-width="2" marker-end="url(#a)"/>
  <line x1="362" y1="139" x2="388" y2="139" stroke="#9a9a9a" stroke-width="2" marker-end="url(#a)"/>
  <line x1="546" y1="139" x2="572" y2="139" stroke="#9a9a9a" stroke-width="2" marker-end="url(#a)"/>

  <line x1="100" y1="222" x2="656" y2="222" stroke="#F37D16" stroke-width="1.5" stroke-dasharray="5,5" stroke-opacity="0.55"/>
  <text x="380" y="247" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#F37D16">scene data back &#8212; object names, transforms, modifier stacks</text>
  <text x="380" y="273" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" fill="#7a7a7a">It never sees your viewport. Everything it knows arrives as structured text.</text>
</svg>
