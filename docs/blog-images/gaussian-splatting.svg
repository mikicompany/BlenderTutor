<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="An abstract cloud of soft, overlapping coloured Gaussian splats resolving into a glowing 3D form">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#211c15"/>
      <stop offset="60%" stop-color="#17130e"/>
      <stop offset="100%" stop-color="#0e0b08"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="soft2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- large soft splats (the cloud) -->
  <g filter="url(#soft)" style="mix-blend-mode:screen">
    <ellipse cx="505" cy="300" rx="150" ry="120" fill="#f0781a" opacity="0.55"/>
    <ellipse cx="640" cy="250" rx="140" ry="150" fill="#d94f8f" opacity="0.5"/>
    <ellipse cx="700" cy="360" rx="160" ry="130" fill="#2e7de0" opacity="0.5"/>
    <ellipse cx="560" cy="400" rx="130" ry="120" fill="#17a26a" opacity="0.5"/>
    <ellipse cx="620" cy="320" rx="120" ry="120" fill="#f5b53a" opacity="0.42"/>
    <ellipse cx="470" cy="380" rx="110" ry="100" fill="#8a56d6" opacity="0.4"/>
    <ellipse cx="760" cy="300" rx="120" ry="110" fill="#e85b3a" opacity="0.4"/>
  </g>

  <!-- finer splats resolving on top -->
  <g filter="url(#soft2)" style="mix-blend-mode:screen">
    <ellipse cx="560" cy="300" rx="42" ry="34" fill="#ffcf8a" opacity="0.8"/>
    <ellipse cx="640" cy="320" rx="38" ry="46" fill="#ff9ec4" opacity="0.7"/>
    <ellipse cx="690" cy="300" rx="46" ry="34" fill="#8fc4ff" opacity="0.7"/>
    <ellipse cx="600" cy="360" rx="34" ry="34" fill="#8af0c0" opacity="0.7"/>
    <ellipse cx="650" cy="270" rx="26" ry="30" fill="#ffe3a8" opacity="0.8"/>
    <ellipse cx="520" cy="350" rx="30" ry="26" fill="#c9a8ff" opacity="0.6"/>
    <ellipse cx="720" cy="350" rx="30" ry="26" fill="#ffb199" opacity="0.6"/>
    <ellipse cx="600" cy="300" rx="20" ry="20" fill="#ffffff" opacity="0.55"/>
  </g>

  <!-- label -->
  <g font-family="'Space Grotesk', system-ui, sans-serif" fill="#f3efe8">
    <text x="90" y="135" font-size="20" letter-spacing="6" fill="#f0781a" opacity="0.9">BLENDER 5.3</text>
    <text x="88" y="195" font-size="62" font-weight="700">Gaussian Splatting</text>
    <text x="90" y="238" font-size="24" fill="#a69d90">Capture reality — render it live.</text>
  </g>
</svg>
